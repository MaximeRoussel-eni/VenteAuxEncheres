    <div class="container mt-4">
        <!-- Titre -->
        <section class="text-center mb-4">
            <h1>Liste des enchères</h1>
        </section>
        <form method="GET" action="/encheres">
            <label for="nomArticle">Nom de l'article :</label>
            <input type="text" id="nomArticle" name="nomArticle" placeholder="Rechercher un article...">

            <label for="categorie">Catégorie :</label>
            <select id="categorie" name="categorie">
                <option value="">Toutes les catégories</option>
                <!-- Parcours dynamique des catégories -->
                    <option data-th-each="c : ${listeCategories}" data-th-value="${c.noCategorie}"
                            data-th-text="${c.libelle}">
                    </option>

            </select>

            <button type="submit">Filtrer</button>
        </form>
