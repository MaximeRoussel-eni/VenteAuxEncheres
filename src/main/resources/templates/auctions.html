<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      data-th-replace="~{fragments/layout::layout(title=~{::title}, main=~{::main})}">
<head>
    <title>Les enchères</title>
</head>
<body>
<main>
    <div class="container">
        <!-- Titre -->
        <section class="text-center my-5">
            <h1 class="display-4">Liste des enchères</h1>
        </section>

        <!-- Filtres -->
        <form method="GET" action="/encheres" class="mb-5">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nomArticle" class="form-label">Nom de l'article :</label>
                    <input type="text" id="nomArticle" name="nomArticle" class="form-control" placeholder="Rechercher un article...">
                </div>
                <div class="col-md-4">
                    <label for="categorie" class="form-label">Catégorie :</label>
                    <select id="categorie" name="categorie" class="form-select">
                        <option value="">Toutes les catégories</option>
                        <option data-th-each="c : ${listeCategories}" data-th-value="${c.noCategorie}"
                                data-th-text="${c.libelle}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Filtrer</button>
                </div>
            </div>
        </form>

        <!-- Liste des articles -->
        <div class="row">
            <div  class="col-md-6 mb-4" th:each="article : ${articleVenduList}">
                <a style="text-decoration: none;" th:href="@{/encheres/detail(noArticleVendu=${article.getNoArticle()})}">
                <div  class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title" th:text="${article.nomArticle}">Titre de l'article</h2>
                        <p class="card-text" th:text="${article.description}">Description de l'article</p>
                        <p class="text-muted">Prix du produit : <span th:text="${article.prixInitial}">Prix</span></p>
                    </div>
                </div>
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
