<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Accueil</title>
    <link rel="stylesheet" data-th-href="@{/css/style.css}">
    <link rel="shortcut icon" type="image/x-icon" data-th-href="@{img/logo.webp}" />

</head>


<body>
<header>
    <button><a th:href="@{/encheres/connexion}"> <img th:src="@{img/logo.webp}" alt="logo enchères" height="150" width="150"/></a></button>
    <a th:href="@{/encheres/connexion}">S'inscrire - Se connecter</a>
</header>


<main>
    <section><h1>Liste des enchères</h1></section>
    <div class="Filtres">
        <section class="Filtres1">
            <div>Filtres:</div>

            <input class="barrerecherche" type="search" value="Le nom de l'article Contient">
            <div class="catégorie">
                <p>Catégories</p>
                <select class="selectionbouton">
                    <option data-th-each="c : ${listeCategories}" data-th-text="${c.libelle}" data-th-value="${c.noCategorie}"></option>
                </select>
            </div>
        </section>
        <section class="RechercherFiltre">
            <button class="rechercherFiltreBouton"></button>
            <a href="login.html">Rechercher</a>
        </section>
    </div>
    <div class="Articles">
        <section class="dansArticles"></section>
        <section class="dansArticles"></section>
    </div>
</main>

<footer></footer>

</body>
</html>
