<html data-th-replace="~{fragments/layout::layout(title=~{::title}, main=~{::main})}">

<title>Création d'enchère</title>

<main>
    <div class="createEnchere">
        <section class="imageArticle">Image</section>
        <section class="createArticle">

            <form data-th-object="${articleVendu}" method="post" data-th-action="creer" class="formulaireVente">
                <div class="TitreVente">Nouvelle Vente</div>
                <p>Article<input data-th-field="*{nomArticle}" type="text" required></p>
                <p>Description<input data-th-field="*{description}" type="text" required></p>

                <p>Catégorie <select data-th-field="*{categorie}">
                    <option data-th-each="c : ${listeCategories}" data-th-text="${c.libelle}" data-th-value="${c.noCategorie}"></option>
                </select></p>
                <p>Photo de l'article <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg"/>
                </p>
                <p>Mise à prix<input data-th-field="*{miseAPrix}" type="number" id="age" min="0" step="1" value="310"
                                     required onchange="changerAge()">
                </p>
                <p>Début de l'enchère<input data-th-field="*{dateDebutEncheres}" type="date" id="start"
                                            name="trip-start" value="2025-07-22" min="2025-01-29"
                                            max="2100-12-31"></p>
                </p>
                <p>Fin de l'enchère<input data-th-field="*{dateFinEncheres}" type="date" id="end" name="trip-start"
                                          value="2025-07-22" min="2025-01-01"
                                          max="2100-12-31"></p>

                <div class="retrait">Retrait
                    <p>Rue<input  type="text"></p>
                    <p>Code Postale<input type="text" maxlength="5" ></p>
                    <p>Ville<input type="text"></p>
                </div>
                <div class="boutonsActions">
                    <button class="boutonActions1"><input type="submit"></button>
                    <button class="boutonActions1"><input type="reset"></button>
                    <button class="boutonActions1"><a th:href="@{/encheres}">Annuler la Vente</a></button>
                </div>
            </form>
        </section>

    </div>

</main>


</html>
