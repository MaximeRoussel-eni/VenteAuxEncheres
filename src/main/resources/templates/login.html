<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personnalisé -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- Icônes FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<!-- Bouton de bascule du thème -->
<button class="theme-toggle">
    <i class="fas fa-moon"></i> <!-- Icône de lune pour le thème sombre -->
</button>

<!-- Conteneur principal -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Connexion</h2>
                    <!-- Formulaire de connexion -->
                    <form method="post" action="/encheres/connexion">
                        <!-- Pseudo -->
                        <div class="mb-3">
                            <label for="pseudo" class="form-label">Pseudo :</label>
                            <input type="text" class="form-control" id="pseudo" name="username" required>
                        </div>
                        <!-- Mot de passe -->
                        <div class="mb-3">
                            <label for="motDePasse" class="form-label">Mot de passe :</label>
                            <input type="password" class="form-control" id="motDePasse" name="password" required>
                        </div>
                        <!-- Bouton de connexion -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Se connecter</button>
                        </div>
                        <input type="hidden" />
                    </form>

                    <!-- Lien vers la page d'inscription -->
                    <p class="mt-3 text-center">Pas encore inscrit ? <a th:href="@{/encheres/inscription}">Inscrivez-vous ici</a></p>

                    <!-- Message d'erreur -->
                    <div th:if="${param.error}" class="alert alert-danger mt-3">
                        Pseudo ou mot de passe incorrect.
                    </div>

                    <!-- Message de déconnexion -->
                    <div th:if="${param.logout}" class="alert alert-success mt-3">
                        Vous avez été déconnecté avec succès.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script personnalisé -->
<script th:src="@{/js/script.js}"></script>
</body>
</html>
