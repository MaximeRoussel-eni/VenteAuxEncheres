<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org" lang="fr" data-th-fragment="layout(title,main)" >

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="${title}">Encheres</title>

    <link rel="shortcut icon" type="image/x-icon" data-th-href="@{/img/logo.webp}" />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/style.css">

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<header class="bg-light py-3">
    <div class="container">
        <nav class="d-flex justify-content-between align-items-center">
            <button class="btn">
                <a th:href="@{/encheres/connexion}">
                    <img th:src="@{/img/logo.webp}" alt="logo enchères" height="50" width="50" />
                </a>
            </button>

            <ul class="nav">
                <li class="nav-item" data-th-if="${!#authorization.expression('isAuthenticated()')}">
                    <a class="nav-link" th:href="@{/login}">Se connecter</a>
                </li>
                <li class="nav-item" data-th-if="${#authorization.expression('isAuthenticated()')}">
                    <form th:action="@{/encheres/logout}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-link">Se déconnecter</button>
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main data-th-replace="${main}"></main>

</body>
