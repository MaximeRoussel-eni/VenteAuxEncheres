<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" data-th-fragment="layout(title,main)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-th-replace="${title}"></title>
    <link rel="shortcut icon" type="image/x-icon" data-th-href="@{/img/logo.webp}"/>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personnalisé -->
    <link rel="stylesheet" data-th-href="@{/css/style.css}">
</head>
<body>
<!-- En-tête -->
<header class="bg-primary text-white py-3">
    <div class="container">
        <nav class="d-flex justify-content-between align-items-center">
            <a th:href="@{/encheres/connexion}" class="navbar-brand">
                <img th:src="@{/img/logo.webp}" alt="Logo enchères" height="50">
            </a>
            <ul class="list-unstyled d-flex mb-0">
                <!-- Lien pour "Se connecter" -->
                <li class="mx-2" data-th-if="${!#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}" class="btn btn-light">Se connecter</a>
                </li>
                <!-- Formulaire pour "Se déconnecter" -->
                <li class="mx-2" data-th-if="${#authorization.expression('isAuthenticated()')}">
                    <form th:action="@{/encheres/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-light">Se déconnecter</button>
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</header>

<!-- Contenu principal -->
<main data-th-replace="${main}" class="py-4"></main>

<!-- Pied de page -->
<footer class="bg-dark text-white py-4">
    <div class="container">
        <div class="row">
            <div class="col-md-4 text-center">
                <p>© Eni 2025-...</p>
            </div>
            <div class="col-md-4 text-center">
                <p>Mentions Légales</p>
                <p>Politique de confidentialité</p>
                <p>CGV</p>
            </div>
            <div class="col-md-4 text-center">
                <p>Nos réseaux :</p>
                <p>Instagram</p>
                <p>Facebook</p>
                <p>LinkedIn</p>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
