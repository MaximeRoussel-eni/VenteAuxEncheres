<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur 404 - Page Introuvable</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 3em;
            color: #00796b;
        }
        p {
            font-size: 1.5em;
            color: #004d40;
        }
        img {
            width: 300px;
            margin-top: 20px;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.2em;
            color: #fff;
            background-color: #00796b;
            text-decoration: none;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #004d40;
        }
    </style>
</head>
<body>
<h1>Oups ! Erreur 404</h1>
<p>Il semble que la page que vous cherchez ait été emportée par une loutre joueuse !</p>
<img th:src="@{/img/loutre2.jpg}" />
<br>
<button class="button"><a th:href="@{/encheres}">Retour à l'accueil</a></button>
</body>
</html>
