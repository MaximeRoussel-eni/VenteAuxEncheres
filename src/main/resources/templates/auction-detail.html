<!DOCTYPE html>
<html data-th-replace="~{fragments/layout::layout(title=~{::title}, main=~{::main})}">

<head>
    <title>Detail de l'enchère</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome pour les icônes -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>

<body>
<button class="theme-toggle">
    <i class="fas fa-moon"></i> <!-- Icône de lune pour le thème sombre -->
</button>

<main>
    <div class="container mt-5">
        <h1>Détail de l'enchère</h1>
        <div class="card">
            <div class="card-body">
                <!-- Section Image -->
                <section class="mb-4">
                    <h5 class="card-title">Image</h5>
                    <img src="https://via.placeholder.com/300" alt="Image de l'article" class="img-fluid">
                </section>

                <!-- Section Détails de la vente -->
                <section>
                    <h5 class="card-title">Détails de la vente</h5>
                    <form method="post" class="formulaireVente">
                        <!-- Infos base article -->
                        <div class="form-group">
                            <label>Article :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.nomArticle}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Description :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.description}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Catégorie :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.categorie.getLibelle()}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Meilleure offre actuelle :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.prixVente}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Mise à prix :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.prixInitial}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Début de l'enchère :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.dateDebutEncheres}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Fin de l'enchère :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.dateFinEncheres}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Lieu de retrait :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.retrait.rue} + ' ' + ${articleVendu.retrait.codePostal} + ' ' + ${articleVendu.retrait.ville}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Prix initial :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.prixInitial} + ' crédits'" readonly>
                        </div>
                        <div class="form-group">
                            <label>Offre la plus élevée :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.prixVente} + ' crédits'" readonly>
                        </div>
                        <div class="form-group">
                            <label>État de la vente :</label>
                            <input type="text" class="form-control" data-th-value="${articleVendu.etatVente}" readonly>
                        </div>
                    </form>
                </section>
            </div>
        </div>

        <!-- Formulaire d'offre pour les utilisateurs non vendeurs -->
        <div data-th-if="${utilisateurEnSession.noUtilisateur!=articleVendu.utilisateurVendeur.noUtilisateur}" class="mt-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Faire une offre</h5>
                    <form method="post" th:if="${articleVendu.etatVente.EN_COURS}" th:action="@{/encheres/detail/offre(noArticleVendu=${articleVendu.noArticle})}" th:object="${enchere}">
                        <div class="form-group">
                            <label for="montantEnchere">Votre prix :</label>
                            <input type="number" class="form-control" data-th-min="${articleVendu.prixVente}" data-th-field="*{montantEnchere}" id="montantEnchere">
                        </div>
                        <button type="submit" class="btn btn-primary">Enchérir</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Formulaire modifiable pour le vendeur -->
        <div data-th-if="${utilisateurEnSession.noUtilisateur==articleVendu.utilisateurVendeur.noUtilisateur}" class="mt-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Modifier l'article</h5>
                    <form method="post" data-th-object="${articleVendu}" data-th-action="@{/encheres/detail/modifier(noArticleVendu=${articleVendu.noArticle})}">
                        <div class="form-group">
                            <label for="nomArticle">Article :</label>
                            <input type="text" class="form-control" data-th-field="*{nomArticle}" id="nomArticle">
                        </div>
                        <div class="form-group">
                            <label for="description">Description :</label>
                            <input type="text" class="form-control" data-th-field="*{description}" id="description">
                        </div>
                        <div class="form-group">
                            <label for="noCategorie">Catégorie :</label>
                            <select class="form-control" name="noCategorie" id="noCategorie">
                                <option data-th-each="c : ${listeCategories}" data-th-text="${c.libelle}" data-th-value="${c.noCategorie}" data-th-selected="${articleVendu.categorie.noCategorie==c.noCategorie}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prixInitial">Mise à prix :</label>
                            <input type="text" class="form-control" data-th-field="*{prixInitial}" id="prixInitial">
                        </div>
                        <div class="form-group">
                            <label for="dateDebutEncheres">Début de l'enchère :</label>
                            <input type="text" class="form-control" data-th-field="*{dateDebutEncheres}" id="dateDebutEncheres">
                        </div>
                        <div class="form-group">
                            <label for="dateFinEncheres">Fin de l'enchère :</label>
                            <input type="text" class="form-control" data-th-field="*{dateFinEncheres}" id="dateFinEncheres">
                        </div>
                        <div class="form-group">
                            <label>Lieu de retrait :</label>
                            <input type="text" class="form-control" data-th-field="*{retrait.rue}" placeholder="Rue">
                            <input type="text" class="form-control mt-2" data-th-field="*{retrait.codePostal}" placeholder="Code Postal" maxlength="5">
                            <input type="text" class="form-control mt-2" data-th-field="*{retrait.ville}" placeholder="Ville">
                        </div>
                        <button type="submit" class="btn btn-primary">Modifier</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lien vers le profil du vendeur -->
        <div class="mt-4">
            <p><strong>Vendeur :</strong> <a th:text="${articleVendu.utilisateurVendeur.pseudo}" th:href="@{/encheres/profilUtilisateur(noUtilisateur=${articleVendu.utilisateurVendeur.noUtilisateur})}" class="btn btn-link"></a></p>
        </div>
    </div>
</main>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
